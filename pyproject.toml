[project]
name = "rollout"
version = "0.1.0"
description = "RollOut: a free, voice-activated daily assistant that runs on your Mac"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "f5-tts-mlx>=0.2.6 ; sys_platform == 'darwin'",
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",
    "numpy>=2.4.6",
    "rumps>=0.4.0 ; sys_platform == 'darwin'",
    "sounddevice>=0.5.6",
]

[project.scripts]
rollout = "rollout.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
